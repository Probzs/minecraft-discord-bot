name: Minecraft Status Bot

on:
  schedule:
    # Toutes les 5 minutes (minimum autorisé par GitHub)
    - cron: "*/5 * * * *"
  workflow_dispatch: # lancement manuel depuis l'interface GitHub

permissions:
  contents: write   # nécessaire pour commiter state.json

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # supprime le warning Node.js 20

jobs:
  update-status:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 📥 Checkout du repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🤖 Exécution du bot
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python bot.py

      - name: 💾 Commit du state.json mis à jour
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase origin main
          git push
